services:

  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    container_name: docsnary-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: docsnary
      POSTGRES_USER: docsnary
      POSTGRES_PASSWORD: docsnary_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U docsnary -d docsnary"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine
    container_name: docsnary-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:

  postgres_data:
    name: docsnary-postgres-data

  redis_data:
    name: docsnary-redis-data